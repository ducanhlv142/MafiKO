<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MafiKO · Tài khoản</title>
</head>

<body>
  <h1>Tài khoản của tôi</h1>
  <p><a href="./budgets.html">Quản lý ngân sách →</a></p>
  <p><a href="./transactions.html">Mở sổ thu chi →</a></p>
  <p><a href="./loans.html">Quản lý vay và cho vay →</a></p>

  <form id="account-form">
    <p>
      <label>Tên tài khoản
        <input name="name" placeholder="Ví dụ: Ví đi làm" required maxlength="60">
      </label>
    </p>
    <p>
      <label>Loại tài khoản
        <select name="kind">
          <option value="cash">Tiền mặt</option>
          <option value="bank">Ngân hàng</option>
          <option value="e_wallet">Ví điện tử</option>
          <option value="credit_card">Thẻ tín dụng</option>
        </select>
      </label>
    </p>
    <p>
      <label>Tiền tệ
        <select name="currency" required></select>
      </label>
    </p>
    <p>
      <label>Số dư đầu kỳ (với thẻ tín dụng, nhập số đang nợ)
        <input name="balance" type="number" step="1" value="0" required>
      </label>
    </p>
    <p>
      <label>Ngày bắt đầu
        <input id="opening-date" name="date" type="date" required>
      </label>
    </p>
    <button id="save" type="submit" disabled>Thêm tài khoản</button>
  </form>

  <p id="status" role="status"></p>
  <h2>Danh sách tài khoản</h2>
  <ul id="accounts"></ul>
  <button id="export-backup" type="button" disabled>Tải bản sao lưu JSON</button>
  <button id="export-csv" type="button" disabled>Xuất CSV</button>
  <p id="csv-status" role="status"></p>
  <button id="export-excel" type="button" disabled>Xuất Excel</button>
  <p id="excel-status" role="status"></p>
  <hr>

  <h2>Nhập giao dịch từ Excel</h2>

  <input id="excel-file" type="file" accept=".xlsx">

  <p id="excel-import-status" role="status"></p>

  <table id="excel-preview" border="1" cellpadding="6" hidden>
    <thead>
      <tr>
        <th>Vị trí</th>
        <th>Ngày</th>
        <th>Loại</th>
        <th>Số tiền</th>
        <th>Nội dung</th>
        <th>Trạng thái</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <p>
    <button id="import-excel" type="button" disabled>
      Xác nhận nhập Excel
    </button>
  </p>

  <hr>
  <hr>

  <h2>Nhập giao dịch từ CSV</h2>

  <input id="csv-file" type="file" accept=".csv,text/csv">

  <p id="csv-import-status" role="status"></p>

  <table id="csv-preview" border="1" cellpadding="6" hidden>
    <thead>
      <tr>
        <th>Dòng</th>
        <th>Ngày</th>
        <th>Loại</th>
        <th>Tài khoản nguồn</th>
        <th>Tài khoản đích</th>
        <th>Số tiền</th>
        <th>Tiền tệ</th>
        <th>Nội dung</th>
        <th>Trạng thái</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <ul id="csv-import-errors"></ul>

  <button id="import-csv" type="button" disabled>
    Xác nhận nhập CSV
  </button>

  <hr>
  <p id="backup-status" role="status"></p>
  <p>
    <label>Chọn bản sao để khôi phục
      <input id="backup-file" type="file" accept=".json,application/json">
    </label>
  </p>
  <p id="restore-preview" role="status"></p>
  <button id="restore-backup" type="button" disabled>Khôi phục và thay thế sổ</button>
  <script src="./node_modules/exceljs/dist/exceljs.min.js"></script>
  <script type="module" src="./dist-web/storage/account-browser.js"></script>
</body>

</html>
