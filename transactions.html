<!doctype html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MafiKO · Thu chi</title>
</head>

<body>
    <a href="./account-demo.html">← Tài khoản</a> |
    <a href="./budgets.html">Ngân sách</a> |
    <a href="./loans.html">Quản lý vay và cho vay →</a>
    <h1>Sổ thu chi</h1>

    <label>Tài khoản <select id="account"></select></label>
    <p><strong id="balance"></strong></p>

    <form id="entry">
        <p><label>Loại
                <select name="kind">
                    <option value="expense">Chi</option>
                    <option value="income">Thu</option>
                </select>
            </label>
        </p>
        <p>
            <label>Danh mục
                <select id="entry-category" name="categoryId" required></select>
            </label>
        </p>
        <p><label>Số tiền <input name="amount" type="number" min="1" step="1" required></label></p>
        <p><label>Ngày <input id="date" name="date" type="date" required></label></p>
        <p><label>Nội dung <input name="note" maxlength="120" placeholder="Tiền cơm trưa" required></label></p>
        <button id="save" disabled>Lưu giao dịch</button>
    </form>
    <h2>Chuyển từ tài khoản đang chọn</h2>

    <form id="transfer-form">
        <p><label>Đến tài khoản
                <select id="transfer-to" required></select>
            </label></p>
        <p><label>Số tiền
                <input name="amount" type="number" min="1" step="1" required>
            </label></p>
        <p><label>Ngày chuyển
                <input id="transfer-date" name="date" type="date" required>
            </label></p>
        <p><label>Nội dung
                <input name="note" maxlength="120" placeholder="Ví dụ: Rút ATM">
            </label></p>
        <button id="transfer-save" disabled>Chuyển tiền</button>
    </form>
    <p id="status" role="status"></p>
    <section>
        <h2>Báo cáo tháng</h2>
        <label>Tháng <input id="report-month" type="month"></label>
        <p id="report-totals"></p>

        <table>
            <thead>
                <tr>
                    <th>Danh mục chi</th>
                    <th>Số tiền</th>
                </tr>
            </thead>
            <tbody id="report-categories"></tbody>
        </table>
    </section>
    <h2>Lịch sử của tài khoản</h2>
    <ul id="history"></ul>
    <dialog id="edit-dialog">
        <h2>Chỉnh sửa giao dịch</h2>

        <form id="edit-form">

            <p>
                <label>Loại giao dịch
                    <select id="edit-kind" name="kind">
                        <option value="expense">Chi</option>
                        <option value="income">Thu</option>
                    </select>
                </label>
            </p>

            <p>
                <label>Danh mục
                    <select id="edit-category" name="categoryId"></select>
                </label>
            </p>

            <p>
                <label>Số tiền
                    <input name="amount" type="number" min="1" step="1" required>
                </label>
            </p>

            <p>
                <label>Ngày
                    <input id="edit-date" name="date" type="date" required>
                </label>
            </p>

            <p>
                <label>Nội dung
                    <input name="note">
                </label>
            </p>

            <p id="edit-status" role="status"></p>

            <button id="edit-save" type="submit">
                Lưu thay đổi
            </button>

            <button id="edit-cancel" type="button">
                Hủy
            </button>

        </form>
    </dialog>
    <dialog id="edit-transfer-dialog">
        <h2>Chỉnh sửa khoản chuyển tiền</h2>

        <p id="edit-transfer-route"></p>

        <form id="edit-transfer-form">

            <p>
                <label>Số tiền
                    <input name="amount" type="number" min="1" step="1" required>
                </label>
            </p>

            <p>
                <label>Ngày chuyển
                    <input id="edit-transfer-date" name="date" type="date" required>
                </label>
            </p>

            <p>
                <label>Nội dung
                    <input name="note">
                </label>
            </p>

            <p id="edit-transfer-status" role="status"></p>

            <button id="edit-transfer-save" type="submit">
                Lưu thay đổi
            </button>

            <button id="edit-transfer-cancel" type="button">
                Hủy
            </button>

        </form>
    </dialog>
    <script type="module" src="./dist-web/storage/transaction-browser.js"></script>
</body>

</html>
